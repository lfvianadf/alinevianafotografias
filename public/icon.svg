<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#FAF8F6"/>
  <!-- 5 overlapping petals: each is an almond/leaf shape anchored at center, radiating outward -->
  <g transform="translate(256,256)" fill="#6B1F35" fill-opacity="0.84">
    <path d="M0,0 C62,-12 68,-110 0,-155 C-68,-110 -62,-12 0,0Z" transform="rotate(0)"/>
    <path d="M0,0 C62,-12 68,-110 0,-155 C-68,-110 -62,-12 0,0Z" transform="rotate(72)"/>
    <path d="M0,0 C62,-12 68,-110 0,-155 C-68,-110 -62,-12 0,0Z" transform="rotate(144)"/>
    <path d="M0,0 C62,-12 68,-110 0,-155 C-68,-110 -62,-12 0,0Z" transform="rotate(216)"/>
    <path d="M0,0 C62,-12 68,-110 0,-155 C-68,-110 -62,-12 0,0Z" transform="rotate(288)"/>
  </g>
  <!-- Small center circle to anchor the design -->
  <circle cx="256" cy="256" r="18" fill="#3D1020"/>
</svg>
